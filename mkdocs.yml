site_name: karyon
site_description: >-
  Genomic track plots for Rust. A stack of tracks over one shared coordinate
  axis, rendered to standalone SVG, with no runtime dependencies and a command
  line front end that reads what a genomics shell already writes.
site_author: PathoGenOmics Lab
site_url: https://pathogenomics-lab.github.io/karyon/

repo_name: PathoGenOmics-Lab/karyon
repo_url: https://github.com/PathoGenOmics-Lab/karyon
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Paula Ruiz-Rodriguez and Mireia Coscolla &middot; MIT

theme:
  name: material
  logo: assets/karyon_logo.svg
  favicon: assets/karyon_logo.svg
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    admonition:
      note: material/dna
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

# Broken cross-references and dead anchors become warnings, which
# `mkdocs build --strict` turns into a failed build.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# The theme loads two families and headings want a third, so it comes in
# alongside rather than through `theme.font`.
# Only what every page needs. `landing.css` and `playground.css` are linked by
# the one page each of them styles, because loading them here meant twenty-nine
# pages fetched eleven kilobytes of render-blocking CSS that matched nothing on
# them. The link sits at the top of that page's markdown, so the browser's
# preload scanner still finds it in the first response.
extra_css:
  # 600 and 700 only. Five hundred was requested and no rule on the site ever
  # asked for it: three of the nine @font-face declarations were for a weight
  # nothing wears, on a render-blocking cross-origin stylesheet that every page
  # waits for.
  - https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap
  - stylesheets/extra.css

# The figures are drawn wider than any column on the site, so each one has to
# be openable at the size it was drawn. This is the only script the site loads
# on every page, and it does nothing until a figure is activated.
extra_javascript:
  - assets/figure-viewer.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # 3 rather than 2: every one of the 36 track entries and every one of
      # the 16 recipes is an H3, so at 2 the sidebar contents on the two
      # longest pages listed their section headings and none of their contents.
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - "."
      check_paths: true
      # The glossary, appended to every page. The `abbr` extension below turns
      # each entry into an `<abbr>` wherever the term appears in prose, and the
      # theme's `content.tooltips` draws it. It reaches prose only: a term
      # inside backticks or inside a code block is left exactly as written.
      #
      # This exists because the site is read by two people who are not the same
      # person. One of them can read a VCF and has never written Rust; the other
      # writes Rust and has never seen a bedGraph. Every term below is cold to
      # one of them at its first use, and defining them here explains them
      # everywhere at once without a word of the prose changing.
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PathoGenOmics-Lab/karyon
      name: karyon on GitHub
  generator: false

# Five destinations rather than eight. The grouping changed and no file moved,
# because a page's URL comes from its path and every link that exists points at
# one of those. What used to be `How it works` and `Recipes` are sections of the
# guide, since a reader looking for either was already in the guide; the plot
# catalogue keeps the track reference next to it, since that is what a route
# through the catalogue ends at.
nav:
  - Home: index.md
  - Playground: playground.md
  - Plots:
      - Overview: plots/index.md
      - Signal and sequence: plots/signal-sequence.md
      - Annotation and coordinates: plots/annotation-coordinates.md
      - Variation and association: plots/variation-association.md
      - Reads and molecules: plots/reads-molecules.md
      - Comparisons and alignments: plots/comparisons-alignments.md
      - Phylogeny and clades: plots/phylogeny-clades.md
      - Evolution and surveillance: plots/evolution-surveillance.md
      - Whole genomes and geography: plots/whole-genomes-geography.md
      - Track reference: tracks.md
  - Guide:
      - Start here:
          - getting-started/installation.md
          - getting-started/quickstart.md
          - Worked recipes: recipes.md
      - Writing a figure:
          - guide/plot.md
          - guide/figure.md
          - guide/cli.md
      - Reading files:
          - guide/formats.md
      - Particular figures:
          - guide/phylogenetics.md
          - guide/maps.md
      - Making it yours:
          - guide/theming.md
          - guide/visual-system.md
      - Why it works this way:
          - how-it-works/coordinates.md
          - how-it-works/scale.md
          - how-it-works/extending.md
  - About:
      - about/changelog.md
      - about/citation.md
      - about/contributing.md
