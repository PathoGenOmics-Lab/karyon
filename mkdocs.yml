site_name: karyon
site_description: >-
  Genomic track plots for Rust. A stack of tracks over one shared coordinate
  axis, rendered to standalone SVG, with no runtime dependencies and a command
  line front end that reads what a genomics shell already writes.
site_author: PathoGenOmics Lab
site_url: https://pathogenomics-lab.github.io/karyon/

repo_name: PathoGenOmics-Lab/karyon
repo_url: https://github.com/PathoGenOmics-Lab/karyon
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Paula Ruiz-Rodriguez and Mireia Coscolla &middot; MIT

theme:
  name: material
  # The home page's hero is a template of its own, overrides/home.html.
  custom_dir: overrides
  logo: assets/karyon_mark.svg
  favicon: assets/favicon.svg
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    admonition:
      note: material/dna
  # Night first: the site is the logo's night, and a light page is one click
  # away for anyone who prefers it. The choice is remembered.
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to the light page
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to the night page
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

# Broken cross-references and dead anchors become warnings, which
# `mkdocs build --strict` turns into a failed build.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# Space Grotesk names things (headings, navigation, buttons); Inter and
# JetBrains Mono come through `theme.font`. karyon.css is the whole site; the
# home page, the playground and the tree viewer link their own stylesheet from
# the one page each of them styles.
extra_css:
  - https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap
  - stylesheets/karyon.css

# The figures are drawn wider than any column on the site, so each one has to
# be openable at the size it was drawn. This is the only script the site loads
# on every page, and it does nothing until a figure is activated.
extra_javascript:
  # The program first, then what draws the figures with it, then the viewer
  # for whatever is still a picture: each skips what the one before took.
  - assets/karyon-wasm.js
  - assets/karyon-figures.js
  - assets/figure-viewer.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # 3 rather than 2: each recipe is an H3 under the group it belongs to.
      # A track entry is an H2 on its family page and its Options and Notes
      # are H4, so a family page's contents list its tracks and nothing else.
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - "."
      check_paths: true
      # The glossary, appended to every page. The `abbr` extension below turns
      # each entry into an `<abbr>` wherever the term appears in prose, and the
      # theme's `content.tooltips` draws it. It reaches prose only: a term
      # inside backticks or inside a code block is left exactly as written.
      #
      # This exists because the site is read by two people who are not the same
      # person. One of them can read a VCF and has never written Rust; the other
      # writes Rust and has never seen a bedGraph. Every term below is cold to
      # one of them at its first use, and defining them here explains them
      # everywhere at once without a word of the prose changing.
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  # Two guides were merged into others. Their old addresses keep working.
  - redirects:
      redirect_maps:
        guide/figure.md: guide/plot.md
        guide/visual-system.md: guide/theming.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PathoGenOmics-Lab/karyon
      name: karyon on GitHub
  generator: false

# Grouped by what a reader has come to do. Get started is the path from nothing
# to a first figure; the gallery finds a plot by the question being asked; the
# guides explain how to do something; the reference is where to look something
# up; the two tools that run in the page have a tab of their own.
nav:
  - Home: index.md
  - Start here: start.md
  - Your data:
      - your-data/index.md
      - Reads, calls and genes: your-data/reads.md
      - An association scan: your-data/scan.md
      - A tree and its samples: your-data/tree.md
      - An alignment and its tree: your-data/alignment.md
      - Two assemblies: your-data/assemblies.md
      - A whole sequence: your-data/genome.md
      - Many samples in windows: your-data/samples.md
      - Pairs of positions: your-data/pairs.md
      - Counts over time: your-data/time.md
      - Selection along a gene: your-data/selection.md
      - A nanopore signal: your-data/signal.md
  - Gallery:
      - plots/index.md
      - Signal and sequence: plots/signal-sequence.md
      - Annotation: plots/annotation-coordinates.md
      - Variation: plots/variation-association.md
      - Reads and molecules: plots/reads-molecules.md
      - Comparisons: plots/comparisons-alignments.md
      - Phylogeny: plots/phylogeny-clades.md
      - Evolution and surveillance: plots/evolution-surveillance.md
      - Whole genomes and maps: plots/whole-genomes-geography.md
  - Reference:
      - Installation: getting-started/installation.md
      - Command line: guide/cli.md
      - File formats: guide/formats.md
      - Core ideas: getting-started/concepts.md
      - Recipes: recipes.md
      - Styling: guide/theming.md
      - Tracks:
          - tracks/index.md
          - Signal and sequence: tracks/signal-sequence.md
          - Annotation: tracks/annotation.md
          - Variation: tracks/variation.md
          - Reads and molecules: tracks/reads-molecules.md
          - Comparison: tracks/comparison.md
          - Phylogeny: tracks/phylogeny.md
          - Evolution and surveillance: tracks/evolution-surveillance.md
          - Whole genome: tracks/whole-genome.md
          - Scales and keys: tracks/scales-keys.md
      - Coordinates: how-it-works/coordinates.md
      - Scale: how-it-works/scale.md
  - Rust:
      - A first program: getting-started/quickstart.md
      - The Rust API: guide/plot.md
      - Phylogenetics: guide/phylogenetics.md
      - Maps: guide/maps.md
      - Writing a track: how-it-works/extending.md
  - Try it:
      - Playground: playground.md
      - Tree viewer: tree.md
  - About:
      - Citation: about/citation.md
      - Contributing: about/contributing.md
      - Changelog: about/changelog.md
