name: Documentation

# Builds the MkDocs Material site and publishes it to GitHub Pages (the
# gh-pages branch). After the first successful run, set Settings -> Pages ->
# Source to "Deploy from a branch" and pick gh-pages (root).
#
# Deliberately manual: this repository runs nothing on push. Press "Run
# workflow" to publish. To have it track main instead, uncomment the push and
# pull_request blocks below, which is what the other tools in the lab do.

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "docs/**"
  #     - "mkdocs.yml"
  #     - "CHANGELOG.md"
  #     - "requirements-docs.txt"
  #     - ".github/workflows/docs.yml"
  # pull_request:
  #   paths:
  #     - "docs/**"
  #     - "mkdocs.yml"
  #     - "CHANGELOG.md"
  #     - "requirements-docs.txt"
  #     - ".github/workflows/docs.yml"

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      # --strict turns a broken internal link or a page missing from the nav
      # into a failed build, so a dead link fails here instead of shipping.
      - name: Build
        run: mkdocs build --strict

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache MkDocs build
        uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ github.sha }}
          path: .cache
          restore-keys: |
            mkdocs-material-

      - name: Install dependencies
        run: pip install -r requirements-docs.txt

      - name: Build and deploy
        run: mkdocs gh-deploy --force --strict
