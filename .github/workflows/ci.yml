name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Test release
        run: cargo test --release
      - name: Docs
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  example:
    name: Example renders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Render the README figures
        run: |
          cargo run --example locus -- assets
          cargo run --example logo -- assets
          cargo run --example pileup -- assets
          cargo run --example ideogram -- assets
          cargo run --example association -- assets
          cargo run --example synteny -- assets
          cargo run --example msa -- assets
      - name: Fail if the committed figures are stale
        run: git diff --exit-code -- assets
