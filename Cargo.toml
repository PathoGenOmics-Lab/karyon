[package]
name = "karyon"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "GPL-3.0-or-later"
description = "Genomic track plots for Rust: composable tracks over a shared coordinate axis, rendered to standalone SVG with no runtime dependencies"
repository = "https://github.com/Paururo/karyon"
homepage = "https://github.com/Paururo/karyon"
readme = "README.md"
keywords = ["genomics", "bioinformatics", "plot", "svg", "sequence"]
categories = ["science", "visualization"]
exclude = ["assets/*", ".github/*"]

